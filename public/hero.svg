<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 400" width="800" height="400">
  <defs>
    <style>
      :root {
        --bg: #f4f5f5;
        --grid-line: rgba(0, 0, 0, 0.05);
        --panel-bg: #e8e8e8;
        --panel-border: #111111;
        --window-bar: #cccccc;
        --text-dark: #111111;
        --text-muted: #666666;
        --accent: #0033cc;
        --accent-alt: #cc3300;
        --pixel-fill: #222222;
      }
      @media (prefers-color-scheme: dark) {
        :root {
          --bg: #0d1117;
          --grid-line: rgba(255, 255, 255, 0.05);
          --panel-bg: #161b22;
          --panel-border: #444c56;
          --window-bar: #21262d;
          --text-dark: #c9d1d9;
          --text-muted: #8b949e;
          --accent: #58a6ff;
          --accent-alt: #ff7b72;
          --pixel-fill: #c9d1d9;
        }
      }
      
      .bg { fill: var(--bg); }
      .grid-line { stroke: var(--grid-line); stroke-width: 1; }
      .border { stroke: var(--panel-border); fill: none; }
      .fill-border { fill: var(--panel-border); }
      
      .panel { fill: var(--panel-bg); stroke: var(--panel-border); stroke-width: 2; }
      .window-bar { fill: var(--window-bar); stroke: var(--panel-border); stroke-width: 2; }
      
      .text-title { fill: var(--text-dark); font-family: ui-monospace, SFMono-Regular, SF Mono, Menlo, Consolas, monospace; font-size: 28px; font-weight: bold; letter-spacing: 2px; }
      .text-sub { fill: var(--text-muted); font-family: ui-monospace, SFMono-Regular, SF Mono, Menlo, Consolas, monospace; font-size: 14px; letter-spacing: 1px; }
      .text-term { fill: var(--text-dark); font-family: ui-monospace, SFMono-Regular, SF Mono, Menlo, Consolas, monospace; font-size: 13px; }
      
      .pixel { fill: var(--pixel-fill); }
      .accent { fill: var(--accent); }
      .accent-alt { fill: var(--accent-alt); }
      
      /* Animation Sequence (Total 20s) */
      @keyframes window-appear {
        0%, 5% { opacity: 0; transform: translateY(20px); }
        15%, 85% { opacity: 1; transform: translateY(0); }
        95%, 100% { opacity: 0; transform: translateY(-20px); }
      }
      @keyframes pixels-gather {
        0%, 10% { opacity: 0; transform: scale(0.8) translate(-20px, -20px); }
        15%, 25% { opacity: 1; transform: scale(1) translate(0, 0); }
        30%, 80% { opacity: 1; transform: scale(1) translate(0, 0); }
        85%, 100% { opacity: 0; transform: scale(1.2) translate(20px, 20px); }
      }
      @keyframes text-emerge {
        0%, 20% { opacity: 0; clip-path: polygon(0 0, 0 0, 0 100%, 0 100%); }
        30%, 80% { opacity: 1; clip-path: polygon(0 0, 100% 0, 100% 100%, 0 100%); }
        90%, 100% { opacity: 0; clip-path: polygon(0 0, 100% 0, 100% 100%, 0 100%); }
      }
      @keyframes signal-move {
        0%, 30% { stroke-dashoffset: 100; opacity: 0; }
        40%, 75% { stroke-dashoffset: 0; opacity: 1; }
        85%, 100% { stroke-dashoffset: -100; opacity: 0; }
      }
      @keyframes cursor-blink {
        0%, 49% { opacity: 1; }
        50%, 100% { opacity: 0; }
      }
      @keyframes float {
        0%, 100% { transform: translateY(0); }
        50% { transform: translateY(-5px); }
      }
      
      .anim-window { animation: window-appear 20s cubic-bezier(0.25, 1, 0.5, 1) infinite; }
      .anim-pixels { animation: pixels-gather 20s cubic-bezier(0.25, 1, 0.5, 1) infinite; }
      .anim-text { animation: text-emerge 20s cubic-bezier(0.25, 1, 0.5, 1) infinite; }
      .anim-signal { stroke-dasharray: 100; stroke-dashoffset: 100; animation: signal-move 20s linear infinite; }
      .cursor { animation: cursor-blink 1s step-end infinite; }
      .float { animation: float 6s ease-in-out infinite; }
      
    </style>
    
    <!-- Background Grid Pattern -->
    <pattern id="bgGrid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" class="grid-line" />
      <!-- tiny crosshairs at intersections -->
      <path d="M -2 0 L 2 0 M 0 -2 L 0 2" class="grid-line" />
    </pattern>
    
    <!-- Stripe Pattern -->
    <pattern id="stripes" width="4" height="4" patternUnits="userSpaceOnUse">
      <path d="M 0 4 L 4 0" stroke="var(--panel-border)" stroke-width="1" opacity="0.2" />
    </pattern>
  </defs>

  <!-- Deep Background Layer -->
  <rect width="100%" height="100%" class="bg" />
  <rect width="100%" height="100%" fill="url(#bgGrid)" />

  <!-- Ambient Geometric Primitives (Background) -->
  <g class="float" style="animation-delay: -2s; opacity: 0.3;">
    <rect x="680" y="40" width="80" height="80" fill="none" class="border" stroke-width="1" />
    <circle cx="720" cy="80" r="30" fill="none" class="border" stroke-dasharray="2 4" />
  </g>
  <g class="float" style="animation-delay: -5s; opacity: 0.2;">
    <rect x="40" y="260" width="120" height="40" fill="url(#stripes)" class="border" stroke-width="1" />
  </g>

  <!-- Layer: Pixels Gather (Animates in first) -->
  <g class="anim-pixels">
    <!-- Abstract structural blocks -->
    <rect x="180" y="80" width="40" height="40" class="fill-border" opacity="0.1" />
    <rect x="220" y="80" width="40" height="40" class="fill-border" opacity="0.2" />
    <rect x="220" y="120" width="40" height="40" class="fill-border" opacity="0.1" />
    <rect x="580" y="240" width="40" height="40" class="fill-border" opacity="0.1" />
    <rect x="540" y="240" width="40" height="40" class="accent" opacity="0.4" />
    
    <!-- Small pixel fragments -->
    <rect x="160" y="100" width="10" height="10" class="pixel" />
    <rect x="170" y="90" width="10" height="10" class="pixel" />
    <rect x="600" y="220" width="10" height="10" class="accent" />
    <rect x="610" y="230" width="10" height="10" class="accent" />
  </g>

  <!-- Layer: Retro Window Panel (Animates in second) -->
  <g class="anim-window" transform="translate(180, 100)">
    <!-- Drop Shadow -->
    <rect x="10" y="10" width="440" height="200" fill="var(--panel-border)" opacity="0.1" />
    <!-- Main Window -->
    <rect x="0" y="0" width="440" height="200" class="panel" />
    
    <!-- Mac-style Window Header -->
    <rect x="0" y="0" width="440" height="24" class="window-bar" />
    <line x1="0" y1="24" x2="440" y2="24" class="border" stroke-width="2" />
    <!-- Header Lines (Retro Macintosh style) -->
    <line x1="60" y1="8" x2="380" y2="8" stroke="var(--panel-border)" stroke-width="1" opacity="0.5" />
    <line x1="60" y1="12" x2="380" y2="12" stroke="var(--panel-border)" stroke-width="1" opacity="0.5" />
    <line x1="60" y1="16" x2="380" y2="16" stroke="var(--panel-border)" stroke-width="1" opacity="0.5" />
    <!-- Close Box -->
    <rect x="8" y="6" width="12" height="12" class="bg" stroke="var(--panel-border)" stroke-width="1" />
    
    <!-- Inner Content Area -->
    <rect x="20" y="44" width="400" height="136" class="bg" stroke="var(--panel-border)" stroke-width="1" />
    
    <!-- Identity Emerges (Animates in third) -->
    <g class="anim-text">
      <!-- Title -->
      <text x="40" y="80" class="text-title">HARSH GOPAL</text>
      <!-- Subtitle -->
      <text x="40" y="110" class="text-sub">AI ENGINEER // FULL-STACK</text>
      
      <!-- Terminal Output -->
      <g transform="translate(40, 145)">
        <text x="0" y="0" class="text-term">$ echo "Building intelligent software"</text>
        <text x="0" y="20" class="text-term">&gt; RUN_SEQUENCE_INITIALIZED</text>
        <rect x="210" y="8" width="8" height="12" class="cursor" />
      </g>
    </g>
  </g>

  <!-- Layer: Technical Signals (Animates in fourth) -->
  <g class="anim-text">
    <!-- Connecting lines from window to grid -->
    <path d="M 620 180 L 660 180 L 660 260" class="border anim-signal" stroke-width="2" fill="none" />
    <path d="M 180 240 L 140 240 L 140 300" class="border anim-signal" stroke-width="2" fill="none" style="animation-delay: 2s;" />
    
    <!-- Geometric indicator nodes -->
    <rect x="655" y="255" width="10" height="10" class="pixel float" style="animation-delay: -1s;" />
    <rect x="135" y="295" width="10" height="10" class="accent float" style="animation-delay: -3s;" />
  </g>

</svg>
