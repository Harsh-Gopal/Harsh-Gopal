<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 300" width="600" height="300">
  <defs>
    <style>
      :root {
        --bg: #fcfcfc;
        --border: #222222;
        --accent: #0044cc;
        --grid: rgba(0,0,0,0.05);
      }
      @media (prefers-color-scheme: dark) {
        :root {
          --bg: #0d1117;
          --border: #444c56;
          --accent: #58a6ff;
          --grid: rgba(255,255,255,0.05);
        }
      }
      .bg { fill: var(--bg); }
      .border { stroke: var(--border); stroke-width: 2; fill: none; }
      .fill { fill: var(--border); }
      .grid-line { stroke: var(--grid); stroke-width: 1; }
      
      .text { font-family: monospace; font-size: 14px; fill: var(--border); }
      .text-title { font-family: monospace; font-size: 18px; font-weight: bold; fill: var(--border); }
      .text-sub { font-family: monospace; font-size: 12px; fill: var(--accent); }
      
      @keyframes dash {
        to { stroke-dashoffset: -20; }
      }
      @keyframes pulse {
        0%, 100% { fill-opacity: 1; }
        50% { fill-opacity: 0.3; }
      }
      .signal {
        stroke: var(--accent);
        stroke-width: 2;
        stroke-dasharray: 4 6;
        animation: dash 1s linear infinite;
      }
      .pulse { animation: pulse 2s ease-in-out infinite; }
    </style>
    <pattern id="smallGrid" width="20" height="20" patternUnits="userSpaceOnUse">
      <path d="M 20 0 L 0 0 0 20" fill="none" class="grid-line" />
    </pattern>
  </defs>

  <rect width="100%" height="100%" class="bg" />
  <rect width="100%" height="100%" fill="url(#smallGrid)" />
  
  <rect x="20" y="20" width="560" height="260" class="border" />
  
  <!-- Title -->
  <text x="40" y="50" class="text-title">PROJECT 01 // CART RADAR</text>
  <text x="40" y="70" class="text-sub">Real-Time Quick-Commerce Inventory Aggregator</text>
  
  <!-- Diagram -->
  <!-- Central Hub -->
  <rect x="260" y="120" width="80" height="80" class="border" />
  <rect x="265" y="125" width="70" height="70" class="border" />
  <text x="300" y="165" class="text" text-anchor="middle">HUB</text>
  
  <!-- Nodes -->
  <g transform="translate(100, 100)">
    <rect x="0" y="0" width="60" height="40" class="border" />
    <rect x="5" y="5" width="10" height="10" class="fill pulse" />
    <text x="30" y="25" class="text-sub" text-anchor="middle">NODE A</text>
  </g>
  <g transform="translate(100, 180)">
    <rect x="0" y="0" width="60" height="40" class="border" />
    <rect x="5" y="5" width="10" height="10" class="fill pulse" style="animation-delay: 0.5s;" />
    <text x="30" y="25" class="text-sub" text-anchor="middle">NODE B</text>
  </g>
  <g transform="translate(440, 140)">
    <rect x="0" y="0" width="60" height="40" class="border" />
    <rect x="5" y="5" width="10" height="10" class="fill pulse" style="animation-delay: 1s;" />
    <text x="30" y="25" class="text-sub" text-anchor="middle">CLIENT</text>
  </g>
  
  <!-- Connections -->
  <path d="M 160 120 L 260 140" class="signal" />
  <path d="M 160 200 L 260 180" class="signal" />
  <path d="M 340 160 L 440 160" class="signal" />
  
  <!-- Pixel Decoration -->
  <rect x="540" y="240" width="10" height="10" class="fill" />
  <rect x="550" y="230" width="10" height="10" class="fill" />
  <rect x="550" y="250" width="10" height="10" class="fill" />
</svg>
