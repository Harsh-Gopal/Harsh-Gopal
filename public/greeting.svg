<svg width="800" height="120" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <style>
      @import url('https://fonts.googleapis.com/css2?family=Noto+Sans+SC:wght@300;400&amp;family=Inter:wght@300;400&amp;display=swap');
      
      .greeting {
        font-family: 'Inter', 'Noto Sans SC', sans-serif;
        font-size: 48px;
        font-weight: 300;
        fill: #fafafa;
        opacity: 0;
      }
      
      
      .g-0 {
        animation: anim-0 24s infinite;
      }
      .g-1 {
        animation: anim-1 24s infinite;
      }
      .g-2 {
        animation: anim-2 24s infinite;
      }
      .g-3 {
        animation: anim-3 24s infinite;
      }
      .g-4 {
        animation: anim-4 24s infinite;
      }
      .g-5 {
        animation: anim-5 24s infinite;
      }
      .g-6 {
        animation: anim-6 24s infinite;
      }
      .g-7 {
        animation: anim-7 24s infinite;
      }

      
    @keyframes anim-0 {
      0%, 0% { opacity: 0; transform: translateY(10px); }
      1.25%, 11.25% { opacity: 1; transform: translateY(0); }
      12.5%, 100% { opacity: 0; transform: translateY(-10px); }
    }
  
    @keyframes anim-1 {
      0%, 12.4% { opacity: 0; transform: translateY(10px); }
      13.75%, 23.75% { opacity: 1; transform: translateY(0); }
      25%, 100% { opacity: 0; transform: translateY(-10px); }
    }
  
    @keyframes anim-2 {
      0%, 24.9% { opacity: 0; transform: translateY(10px); }
      26.25%, 36.25% { opacity: 1; transform: translateY(0); }
      37.5%, 100% { opacity: 0; transform: translateY(-10px); }
    }
  
    @keyframes anim-3 {
      0%, 37.4% { opacity: 0; transform: translateY(10px); }
      38.75%, 48.75% { opacity: 1; transform: translateY(0); }
      50%, 100% { opacity: 0; transform: translateY(-10px); }
    }
  
    @keyframes anim-4 {
      0%, 49.9% { opacity: 0; transform: translateY(10px); }
      51.25%, 61.25% { opacity: 1; transform: translateY(0); }
      62.5%, 100% { opacity: 0; transform: translateY(-10px); }
    }
  
    @keyframes anim-5 {
      0%, 62.4% { opacity: 0; transform: translateY(10px); }
      63.75%, 73.75% { opacity: 1; transform: translateY(0); }
      75%, 100% { opacity: 0; transform: translateY(-10px); }
    }
  
    @keyframes anim-6 {
      0%, 74.9% { opacity: 0; transform: translateY(10px); }
      76.25%, 86.25% { opacity: 1; transform: translateY(0); }
      87.5%, 100% { opacity: 0; transform: translateY(-10px); }
    }
  
    @keyframes anim-7 {
      0%, 87.4% { opacity: 0; transform: translateY(10px); }
      88.75%, 98.75% { opacity: 1; transform: translateY(0); }
      100%, 100% { opacity: 0; transform: translateY(-10px); }
    }
  
    </style>
  </defs>

  
    <text 
      x="50%" 
      y="50%" 
      text-anchor="middle" 
      dominant-baseline="middle" 
      class="greeting g-0"
    >Hello</text>
  
    <text 
      x="50%" 
      y="50%" 
      text-anchor="middle" 
      dominant-baseline="middle" 
      class="greeting g-1"
    >नमस्ते</text>
  
    <text 
      x="50%" 
      y="50%" 
      text-anchor="middle" 
      dominant-baseline="middle" 
      class="greeting g-2"
    >你好</text>
  
    <text 
      x="50%" 
      y="50%" 
      text-anchor="middle" 
      dominant-baseline="middle" 
      class="greeting g-3"
    >Hola</text>
  
    <text 
      x="50%" 
      y="50%" 
      text-anchor="middle" 
      dominant-baseline="middle" 
      class="greeting g-4"
    >Bonjour</text>
  
    <text 
      x="50%" 
      y="50%" 
      text-anchor="middle" 
      dominant-baseline="middle" 
      class="greeting g-5"
    >こんにちは</text>
  
    <text 
      x="50%" 
      y="50%" 
      text-anchor="middle" 
      dominant-baseline="middle" 
      class="greeting g-6"
    >안녕하세요</text>
  
    <text 
      x="50%" 
      y="50%" 
      text-anchor="middle" 
      dominant-baseline="middle" 
      class="greeting g-7"
    >مرحبا</text>
  
</svg>