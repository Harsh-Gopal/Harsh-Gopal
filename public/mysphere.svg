<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 300" width="600" height="300">
  <defs>
    <style>
      :root {
        --bg: #fcfcfc;
        --border: #222222;
        --accent: #0044cc;
        --grid: rgba(0,0,0,0.05);
      }
      @media (prefers-color-scheme: dark) {
        :root {
          --bg: #0d1117;
          --border: #444c56;
          --accent: #58a6ff;
          --grid: rgba(255,255,255,0.05);
        }
      }
      .bg { fill: var(--bg); }
      .border { stroke: var(--border); stroke-width: 2; fill: none; }
      .fill { fill: var(--border); }
      .grid-line { stroke: var(--grid); stroke-width: 1; }
      
      .text { font-family: monospace; font-size: 14px; fill: var(--border); }
      .text-title { font-family: monospace; font-size: 18px; font-weight: bold; fill: var(--border); }
      .text-sub { font-family: monospace; font-size: 12px; fill: var(--accent); }
      
      @keyframes sync {
        0% { transform: translateY(0); opacity: 1; }
        50% { transform: translateY(-10px); opacity: 0; }
        50.1% { transform: translateY(10px); opacity: 0; }
        100% { transform: translateY(0); opacity: 1; }
      }
      .sync-anim { animation: sync 3s ease-in-out infinite; }
    </style>
    <pattern id="smallGrid" width="20" height="20" patternUnits="userSpaceOnUse">
      <path d="M 20 0 L 0 0 0 20" fill="none" class="grid-line" />
    </pattern>
  </defs>

  <rect width="100%" height="100%" class="bg" />
  <rect width="100%" height="100%" fill="url(#smallGrid)" />
  <rect x="20" y="20" width="560" height="260" class="border" />
  
  <text x="40" y="50" class="text-title">PROJECT 02 // MYSPHERE</text>
  <text x="40" y="70" class="text-sub">Cross-device Environment &amp; Ecosystem</text>

  <!-- Central Cloud/Sync Node -->
  <circle cx="300" cy="180" r="30" class="border" />
  <circle cx="300" cy="180" r="20" class="border" stroke-dasharray="4 4" />
  <text x="300" y="184" class="text-sub" text-anchor="middle">SYNC</text>

  <!-- Mac -->
  <g transform="translate(100, 130)">
    <rect x="0" y="0" width="80" height="60" class="border" />
    <rect x="5" y="5" width="70" height="40" class="border" />
    <path d="M 20 60 L 10 70 L 70 70 L 60 60" class="border" />
    <text x="40" y="90" class="text" text-anchor="middle">MAC</text>
  </g>

  <!-- Windows -->
  <g transform="translate(420, 130)">
    <rect x="0" y="0" width="80" height="60" class="border" />
    <rect x="5" y="5" width="70" height="40" class="border" />
    <rect x="30" y="60" width="20" height="10" class="border" />
    <path d="M 10 70 L 70 70" class="border" />
    <text x="40" y="90" class="text" text-anchor="middle">WINDOWS</text>
  </g>

  <!-- Android -->
  <g transform="translate(280, 70)">
    <rect x="0" y="0" width="40" height="60" class="border" rx="4" />
    <rect x="5" y="5" width="30" height="40" class="border" />
    <circle cx="20" cy="52" r="3" class="fill" />
    <text x="20" y="-10" class="text" text-anchor="middle">ANDROID</text>
  </g>

  <!-- Data Packets -->
  <rect x="200" y="155" width="8" height="8" class="fill sync-anim" />
  <rect x="392" y="195" width="8" height="8" class="fill sync-anim" style="animation-delay: 1s;" />
  <rect x="296" y="140" width="8" height="8" class="fill sync-anim" style="animation-delay: 2s;" />

  <!-- Connection Lines -->
  <path d="M 180 160 L 270 180" class="border" stroke-dasharray="2 4" />
  <path d="M 420 160 L 330 180" class="border" stroke-dasharray="2 4" />
  <path d="M 300 130 L 300 150" class="border" stroke-dasharray="2 4" />
</svg>
