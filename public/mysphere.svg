<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 300" width="600" height="300">
  <defs>
    <style>
      :root {
        --bg: #f4f5f5;
        --grid-line: rgba(0, 0, 0, 0.05);
        --panel-bg: #e8e8e8;
        --panel-border: #111111;
        --window-bar: #cccccc;
        --text-dark: #111111;
        --text-muted: #666666;
        --accent: #0033cc;
      }
      @media (prefers-color-scheme: dark) {
        :root {
          --bg: #0d1117;
          --grid-line: rgba(255, 255, 255, 0.05);
          --panel-bg: #161b22;
          --panel-border: #444c56;
          --window-bar: #21262d;
          --text-dark: #c9d1d9;
          --text-muted: #8b949e;
          --accent: #58a6ff;
        }
      }
      .bg { fill: var(--bg); }
      .grid-line { stroke: var(--grid-line); stroke-width: 1; }
      .border { stroke: var(--panel-border); stroke-width: 2; fill: none; }
      .border-thin { stroke: var(--panel-border); stroke-width: 1; fill: none; }
      .panel { fill: var(--panel-bg); stroke: var(--panel-border); stroke-width: 2; }
      .window-bar { fill: var(--window-bar); stroke: var(--panel-border); stroke-width: 2; }
      .fill { fill: var(--panel-border); }
      .text-title { font-family: ui-monospace, SFMono-Regular, Menlo, monospace; font-size: 16px; font-weight: bold; fill: var(--text-dark); }
      .text-sub { font-family: ui-monospace, SFMono-Regular, Menlo, monospace; font-size: 11px; fill: var(--text-muted); }
      .text-node { font-family: ui-monospace, SFMono-Regular, Menlo, monospace; font-size: 10px; fill: var(--text-dark); text-anchor: middle; }
      
      @keyframes float-packet {
        0% { transform: translateY(0); opacity: 1; }
        50% { transform: translateY(-10px); opacity: 0; }
        50.1% { transform: translateY(10px); opacity: 0; }
        100% { transform: translateY(0); opacity: 1; }
      }
      @keyframes dash {
        to { stroke-dashoffset: -20; }
      }
      .packet { animation: float-packet 3s cubic-bezier(0.4, 0, 0.2, 1) infinite; }
      .signal { stroke: var(--accent); stroke-width: 2; stroke-dasharray: 4 6; animation: dash 2s linear infinite; }
    </style>
    <pattern id="bgGrid" width="20" height="20" patternUnits="userSpaceOnUse">
      <path d="M 20 0 L 0 0 0 20" fill="none" class="grid-line" />
    </pattern>
  </defs>

  <rect width="100%" height="100%" class="bg" />
  <rect width="100%" height="100%" fill="url(#bgGrid)" />
  
  <rect x="20" y="20" width="560" height="260" class="panel" />
  
  <rect x="20" y="20" width="560" height="24" class="window-bar" />
  <line x1="20" y1="44" x2="580" y2="44" class="border" />
  <line x1="60" y1="28" x2="540" y2="28" class="border-thin" opacity="0.5" />
  <line x1="60" y1="32" x2="540" y2="32" class="border-thin" opacity="0.5" />
  <line x1="60" y1="36" x2="540" y2="36" class="border-thin" opacity="0.5" />
  <rect x="28" y="26" width="12" height="12" class="bg" stroke="var(--panel-border)" stroke-width="1" />
  
  <rect x="30" y="54" width="540" height="216" class="bg" stroke="var(--panel-border)" stroke-width="1" />

  <text x="50" y="85" class="text-title">PROJECT 02: MYSPHERE</text>
  <text x="50" y="105" class="text-sub">Topology: Cross-Device Ecosystem</text>

  <!-- Central Cloud Sync Node -->
  <g transform="translate(260, 150)">
    <rect x="0" y="0" width="60" height="60" class="border" rx="10" />
    <circle cx="30" cy="30" r="15" class="border" stroke-dasharray="4 2" />
    <circle cx="30" cy="30" r="5" class="fill" />
    <text x="30" y="75" class="text-node">CLOUD_SYNC</text>
  </g>

  <!-- Mac (Top Left) -->
  <g transform="translate(70, 90)">
    <rect x="0" y="0" width="80" height="50" class="border" />
    <rect x="5" y="5" width="70" height="30" class="border" />
    <!-- Stand -->
    <path d="M 30 50 L 25 60 L 55 60 L 50 50" class="border" fill="var(--panel-bg)" />
    <text x="40" y="75" class="text-node">MAC</text>
  </g>

  <!-- Windows (Bottom Left) -->
  <g transform="translate(70, 190)">
    <rect x="0" y="0" width="80" height="50" class="border" />
    <rect x="5" y="5" width="70" height="30" class="border" />
    <path d="M 10 60 L 70 60" class="border" />
    <rect x="30" y="50" width="20" height="10" class="border" fill="var(--panel-bg)" />
    <text x="40" y="75" class="text-node">WINDOWS</text>
  </g>

  <!-- Android (Right) -->
  <g transform="translate(440, 140)">
    <!-- Phone shape -->
    <rect x="0" y="0" width="40" height="70" class="border" rx="4" />
    <rect x="5" y="10" width="30" height="50" class="border" />
    <circle cx="20" cy="5" r="1.5" class="fill" />
    <text x="20" y="85" class="text-node">ANDROID</text>
  </g>

  <!-- Animated Data Packets -->
  <rect x="190" y="125" width="6" height="6" class="fill packet" />
  <rect x="190" y="205" width="6" height="6" class="fill packet" style="animation-delay: 1s;" />
  <rect x="380" y="170" width="6" height="6" class="fill packet" style="animation-delay: 0.5s;" />

  <!-- Signal Connections -->
  <path d="M 150 120 L 200 120 L 200 160 L 260 160" class="signal" fill="none" />
  <path d="M 150 210 L 200 210 L 200 190 L 260 190" class="signal" fill="none" />
  <path d="M 320 175 L 440 175" class="signal" fill="none" />
  
  <rect x="550" y="55" width="18" height="214" class="panel" />
  <line x1="550" y1="75" x2="568" y2="75" class="border" />
  <line x1="550" y1="249" x2="568" y2="249" class="border" />
  <rect x="552" y="120" width="14" height="60" class="fill" opacity="0.3" />
  <path d="M 559 60 L 555 70 L 563 70 Z" class="fill" />
  <path d="M 559 264 L 555 254 L 563 254 Z" class="fill" />
</svg>
