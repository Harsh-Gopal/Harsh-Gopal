<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 300" width="600" height="300">
  <defs>
    <style>
      :root {
        --bg: #f4f5f5;
        --grid-line: rgba(0, 0, 0, 0.05);
        --panel-bg: #e8e8e8;
        --panel-border: #111111;
        --window-bar: #cccccc;
        --text-dark: #111111;
        --text-muted: #666666;
        --accent: #0033cc;
      }
      @media (prefers-color-scheme: dark) {
        :root {
          --bg: #0d1117;
          --grid-line: rgba(255, 255, 255, 0.05);
          --panel-bg: #161b22;
          --panel-border: #444c56;
          --window-bar: #21262d;
          --text-dark: #c9d1d9;
          --text-muted: #8b949e;
          --accent: #58a6ff;
        }
      }
      .bg { fill: var(--bg); }
      .grid-line { stroke: var(--grid-line); stroke-width: 1; }
      .border { stroke: var(--panel-border); stroke-width: 2; fill: none; }
      .border-thin { stroke: var(--panel-border); stroke-width: 1; fill: none; }
      .panel { fill: var(--panel-bg); stroke: var(--panel-border); stroke-width: 2; }
      .window-bar { fill: var(--window-bar); stroke: var(--panel-border); stroke-width: 2; }
      .fill { fill: var(--panel-border); }
      
      .text-head { font-family: ui-monospace, SFMono-Regular, Menlo, monospace; font-size: 13px; font-weight: bold; fill: var(--text-dark); }
      .text-sub { font-family: ui-monospace, SFMono-Regular, Menlo, monospace; font-size: 11px; fill: var(--text-muted); }
      .text-title { font-family: ui-monospace, SFMono-Regular, Menlo, monospace; font-size: 16px; font-weight: bold; fill: var(--text-dark); }
      
      @keyframes float {
        0%, 100% { transform: translateY(0); }
        50% { transform: translateY(-3px); }
      }
      .anim { animation: float 6s ease-in-out infinite; }
    </style>
    <pattern id="bgGrid" width="20" height="20" patternUnits="userSpaceOnUse">
      <path d="M 20 0 L 0 0 0 20" fill="none" class="grid-line" />
    </pattern>
  </defs>

  <rect width="100%" height="100%" class="bg" />
  <rect width="100%" height="100%" fill="url(#bgGrid)" />
  
  <!-- Outer Window -->
  <rect x="20" y="20" width="560" height="260" class="panel" />
  <rect x="20" y="20" width="560" height="24" class="window-bar" />
  <line x1="20" y1="44" x2="580" y2="44" class="border" />
  <line x1="60" y1="28" x2="540" y2="28" class="border-thin" opacity="0.5" />
  <line x1="60" y1="32" x2="540" y2="32" class="border-thin" opacity="0.5" />
  <line x1="60" y1="36" x2="540" y2="36" class="border-thin" opacity="0.5" />
  <rect x="28" y="26" width="12" height="12" class="bg" stroke="var(--panel-border)" stroke-width="1" />
  
  <rect x="30" y="54" width="540" height="216" class="bg" stroke="var(--panel-border)" stroke-width="1" />

  <text x="50" y="85" class="text-title">04 / SYSTEM COMPONENTS</text>

  <!-- Blocks -->
  <!-- LANGUAGES -->
  <g transform="translate(50, 110)" class="anim">
    <rect x="0" y="0" width="150" height="60" class="border-thin" fill="var(--panel-bg)" />
    <!-- Mini floppy icon -->
    <rect x="5" y="5" width="10" height="10" class="fill" />
    <rect x="7" y="5" width="6" height="4" class="bg" />
    
    <text x="25" y="15" class="text-head">LANGUAGES</text>
    <text x="10" y="35" class="text-sub">Python, JS/TS</text>
    <text x="10" y="50" class="text-sub">Java, C++, SQL</text>
  </g>

  <!-- FRONTEND -->
  <g transform="translate(220, 110)" class="anim" style="animation-delay: 1s;">
    <rect x="0" y="0" width="150" height="60" class="border-thin" fill="var(--panel-bg)" />
    <!-- Mini screen icon -->
    <rect x="5" y="6" width="12" height="8" class="fill" />
    
    <text x="25" y="15" class="text-head">FRONTEND</text>
    <text x="10" y="35" class="text-sub">React, Next.js</text>
    <text x="10" y="50" class="text-sub">Tailwind, HTML/CSS</text>
  </g>

  <!-- BACKEND -->
  <g transform="translate(390, 110)" class="anim" style="animation-delay: 2s;">
    <rect x="0" y="0" width="150" height="60" class="border-thin" fill="var(--panel-bg)" />
    <!-- Mini server icon -->
    <rect x="5" y="5" width="10" height="10" class="border-thin" />
    <line x1="5" y1="10" x2="15" y2="10" class="border-thin" />
    
    <text x="25" y="15" class="text-head">BACKEND</text>
    <text x="10" y="35" class="text-sub">FastAPI, Node.js</text>
    <text x="10" y="50" class="text-sub">Express.js</text>
  </g>

  <!-- AI -->
  <g transform="translate(50, 190)" class="anim" style="animation-delay: 1.5s;">
    <rect x="0" y="0" width="320" height="60" class="border-thin" fill="var(--panel-bg)" />
    <!-- Mini brain/network icon -->
    <circle cx="10" cy="10" r="3" class="fill" />
    <circle cx="6" cy="15" r="2" class="fill" />
    <circle cx="14" cy="15" r="2" class="fill" />
    <path d="M 10 10 L 6 15 M 10 10 L 14 15" class="border-thin" />
    
    <text x="25" y="15" class="text-head">AI ENGINEERING</text>
    <text x="10" y="35" class="text-sub">AI Agents, LangChain, LangGraph, RAG</text>
    <text x="10" y="50" class="text-sub">Prompt Eng, LLM APIs, MCP, n8n</text>
  </g>

  <!-- TOOLS -->
  <g transform="translate(390, 190)" class="anim" style="animation-delay: 0.5s;">
    <rect x="0" y="0" width="150" height="60" class="border-thin" fill="var(--panel-bg)" />
    <!-- Mini gear icon abstract -->
    <rect x="6" y="6" width="8" height="8" class="border-thin" />
    <rect x="8" y="8" width="4" height="4" class="fill" />
    
    <text x="25" y="15" class="text-head">TOOLS</text>
    <text x="10" y="35" class="text-sub">Git, Firebase</text>
    <text x="10" y="50" class="text-sub">MongoDB, Docker</text>
  </g>

</svg>
